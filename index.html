<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles/index.css">
  <link rel="stylesheet" href="./assets/styles/general.css">
  <title>Fitness Tracker</title>
</head>
<body class="layout--fixed-scroll">
<main>
  <header>
    <span class="header__label">Routine</span>
  </header>

  <div class="main__content">
    <div class="warmup">
      <div class="warmup__header">
        <span class="warmup__title">
          Warm-Up
          <svg class="warmup__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14H10L9 22L19 10H12L13 2Z"/>
          </svg>
        </span>
        <span class="warmup__toggle js-warmup-toggle">Hide 4 exercises</span>
      </div>
      <div class="exercises js-warmup-exercises">
        <div class="exercises-card">
          <div class="exercises-card__info">
            <img class="exercises-card__image" src="./assets/images/exercises/jumping-jacks.png" alt="Jumping Jacks">
            <span class="exercises-card__title">Jumping Jacks</span>
          </div>
          <span class="exercises-card__details">20-30</span>
        </div>
        <div class="exercises-card">
          <div class="exercises-card__info">
            <img class="exercises-card__image" src="./assets/images/exercises/arm-circles.png" alt="Arm Circles">
            <span class="exercises-card__title">Arm Circles</span>
          </div>
          <span class="exercises-card__details">10-15</span>
        </div>
        <div class="exercises-card">
          <div class="exercises-card__info">
            <img class="exercises-card__image" src="./assets/images/exercises/leg-swings.png" alt="Leg Swings">
            <span class="exercises-card__title">Leg Swings</span>
          </div>
          <span class="exercises-card__details">10-15</span>
        </div>
        <div class="exercises-card">
          <div class="exercises-card__info">
            <img class="exercises-card__image" src="./assets/images/exercises/bodyweight-squats.png" alt="Bodyweight Squats">
            <span class="exercises-card__title">Bodyweight Squats</span>
          </div>
          <span class="exercises-card__details">10-15</span>
        </div>
      </div>
    </div>

    <div class="routine js-routine-container">
      <span class="js-routine-title"></span>
        <div class="exercises js-routine-exercises">
        </div>
    </div>
  </div>

  <!-- routine -->
  <div class="js-workout-overlay workout-overlay">
    <div class="workout__container" style="position: relative;"> 

      <div class="workout__header">
        <button class="js-workout-close workout__close" aria-label="Close workout">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </button>
        <span class="js-workout-phase workout__phase">Warm Up</span>
        <span class="js-workout-progress workout__progress">1/12</span>
      </div>

      <div class="js-workout-timer-container workout__timer">
        <svg class="workout__timer-circle" viewBox="0 0 120 120">
          <circle class="workout__timer-bg" cx="60" cy="60" r="54" fill="none" stroke="#3a3a3a" stroke-width="6"/>
          <circle class="js-workout-timer-circle workout__timer-fg" cx="60" cy="60" r="54" fill="none" stroke="#b5ff22" stroke-width="6" 
            stroke-dasharray="339.292" stroke-dashoffset="0"
            transform="rotate(-90 60 60)"/>
        </svg>
        <span class="js-workout-timer workout__timer-number">30</span>
      </div>

      <div class="workout__exercise js-workout-exercise">
        <img class="js-workout-exercise-image workout__exercise-image" src="" alt="">
        <span class="js-workout-exercise-name workout__exercise-name">Jumping Jacks</span>
        <div class="workout__exercise-details">
          <span class="js-workout-exercise-details workout__exercise-details-text">3 × 12 reps</span>
        </div>
      </div>

      <div class="workout__controls">
        <button class="js-workout-pause workout__btn workout__btn--pause">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
          Pause
        </button>
        <button class="js-workout-skip workout__btn workout__btn--skip" style="display:none;">
          Skip 
        </button>
        <button class="js-workout-next workout__btn workout__btn--next is-disabled">
          Next 5s
        </button>
      </div>

      <div class="js-workout-progress-bar workout__progress-bar">
        <div class="js-workout-progress-bar-fill workout__progress-bar-fill"></div>
      </div>

      <div class="js-workout-routine-phase workout__routine-phase" style="display:none;">

        <div class="workout__rest-controls">
          <span class="workout__rest-label">Rest</span>
          <div class="workout__rest-timer">
            <button class="js-rest-decrease workout__rest-btn">-15</button>
            <span class="js-workout-rest-time workout__rest-time">1:00</span>
            <button class="js-rest-increase workout__rest-btn">+15</button>
          </div>
        </div>

        <div class="workout__set-info">
          <span class="js-workout-set-info workout__set-info-text">Set 1 of 3</span>
        </div>

        <div class="workout__reps-container">
          <span class="workout__reps-label">Reps</span>
          <div class="workout__reps-controls">
            <button class="js-reps-decrease workout__reps-btn">-</button>
            <input class="js-workout-reps-input workout__reps-input" type="number" value="0" min="0">
            <button class="js-reps-increase workout__reps-btn">+</button>
          </div>
          <button class="js-workout-log-set workout__btn workout__btn--log">Log Set</button>
        </div>

        <div class="workout__history">
          <span class="workout__history-label">Last workout:</span>
          <span class="js-workout-history workout__history-value">0/0/0</span>
        </div>
      </div>

       <div class="js-workout-complete workout__complete workout__complete--hidden">
        <div class="workout__complete-icon">🎉</div>
        <div class="workout__complete-title">Workout Complete!</div>
        <div class="workout__complete-stats">
          <div class="workout__complete-stat">
            <span class="workout__complete-stat-value js-complete-exercises">0</span>
            <span class="workout__complete-stat-label">Exercises</span>
          </div>
          <div class="workout__complete-stat">
            <span class="workout__complete-stat-value js-complete-time">0m 0s</span>
            <span class="workout__complete-stat-label">Total Time</span>
          </div>
        </div>
        <button class="js-workout-complete-btn workout__complete-btn">Done</button>
      </div>

    </div>
  </div>

  <button class="start-routine">Start Routine</button>

  <nav class="nav nav--routine">
    <a href="index.html" class="nav__item">
      <svg viewBox="0 0 24 24" class="nav__icon">
        <path d="M3 10L12 3l9 7v11a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10z" />
      </svg>
      <span class="nav__label">Routine</span>
    </a>

    <a href="#" class="nav__item">
      <svg viewBox="0 0 24 24" class="nav__icon">
        <path d="M7 10h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM5 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V2h2v2h8V2h2v2h1a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5zm14-2V9H5v9h14z"/>
      </svg>
      <span class="nav__label">History</span>
    </a>

    <a href="settings.html" class="nav__item">
      <svg viewBox="0 0 24 24" class="nav__icon">
        <path d="M19.43 12.98c.04-.32.07-.66.07-1s-.03-.68-.07-1l2.11-1.65a.5.5 0 0 0 .12-.63l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.05 7.05 0 0 0-1.73-1L14 2.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5L9.15 5a7.05 7.05 0 0 0-1.73 1l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.63l2.11 1.65c-.04.32-.07.66-.07 1s.03.68.07 1l-2.11 1.65a.5.5 0 0 0-.12.63l2 3.46c.14.24.43.33.68.22l2.49-1c.53.42 1.1.77 1.73 1L10 21.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5l.35-2.53a7.05 7.05 0 0 0 1.73-1l2.49 1c.25.11.54.02.68-.22l2-3.46a.5.5 0 0 0-.12-.63l-2.11-1.65zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
        <circle cx="12" cy="12" r="1.5" fill="#111"/>
      </svg>
      <span class="nav__label">Settings</span>
    </a>
  </nav>
  <script type="module" src="/assets/scripts/index.js"></script>
</main>
</body>
</html>
